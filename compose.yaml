name: upraise

x-ingestion-environment: &ingestion-environment
  UPRAISE_ENVIRONMENT: ${UPRAISE_ENVIRONMENT:-production}
  UPRAISE_LOCAL_TEST_MODE: ${UPRAISE_LOCAL_TEST_MODE:-false}
  UPRAISE_JOBS_DSN: ${UPRAISE_JOBS_DSN:-postgresql://upraise_jobs:${JOBS_PASSWORD:-upraise_jobs_password}@postgres:5432/upraise_jobs}
  UPRAISE_AUDIT_DSN: ${UPRAISE_AUDIT_DSN:-postgresql://upraise_audit_app:${AUDIT_PASSWORD:-upraise_audit_password}@postgres:5432/${POSTGRES_DB:-upraise_audit}}
  UPRAISE_DATA_DIR: /data/ingestion
  UPRAISE_AWS_CREDENTIALS_FILE: /run/secrets/aws_credentials.json
  UPRAISE_AWS_REGION: ${UPRAISE_AWS_REGION:-eu-central-1}
  UPRAISE_FIDELITY_VISION_MODEL_ID: ${UPRAISE_FIDELITY_VISION_MODEL_ID:-eu.amazon.nova-pro-v1:0}
  UPRAISE_MAX_CSV_SIZE_MB: ${UPRAISE_MAX_CSV_SIZE_MB:-100}
  UPRAISE_MAX_CSV_ROWS: ${UPRAISE_MAX_CSV_ROWS:-100000}
  UPRAISE_MAX_CSV_COLUMNS: ${UPRAISE_MAX_CSV_COLUMNS:-256}
  UPRAISE_MAX_WORD_SIZE_MB: ${UPRAISE_MAX_WORD_SIZE_MB:-100}
  UPRAISE_MAX_WORD_UNCOMPRESSED_MB: ${UPRAISE_MAX_WORD_UNCOMPRESSED_MB:-500}
  UPRAISE_WORD_CONVERSION_TIMEOUT_SECONDS: ${UPRAISE_WORD_CONVERSION_TIMEOUT_SECONDS:-180}
  UPRAISE_WORD_VISUAL_FALLBACK: ${UPRAISE_WORD_VISUAL_FALLBACK:-true}
  UPRAISE_OAUTH_ISSUER: ${UPRAISE_OAUTH_ISSUER:-}
  UPRAISE_OAUTH_AUDIENCE: ${UPRAISE_OAUTH_AUDIENCE:-}
  UPRAISE_OAUTH_JWKS_URL: ${UPRAISE_OAUTH_JWKS_URL:-}
  UPRAISE_OAUTH_CLIENTS: ${UPRAISE_OAUTH_CLIENTS:-[]}
  UPRAISE_TRUSTED_PROXY_CIDRS: ${UPRAISE_TRUSTED_PROXY_CIDRS:-[]}
  UPRAISE_MTLS_ALLOWED_FINGERPRINTS: ${UPRAISE_MTLS_ALLOWED_FINGERPRINTS:-[]}
  UPRAISE_MOODLE_ALLOWED_CIDRS: ${UPRAISE_MOODLE_ALLOWED_CIDRS:-[]}
  UPRAISE_ARTIFACT_RETENTION_DAYS: ${UPRAISE_ARTIFACT_RETENTION_DAYS:-0}
  UPRAISE_LESSON_GENERATION_MODEL_ID: ${UPRAISE_LESSON_GENERATION_MODEL_ID:-openai.gpt-oss-120b-1:0}
  UPRAISE_LESSON_REVIEW_MODEL_ID: ${UPRAISE_LESSON_REVIEW_MODEL_ID:-qwen.qwen3-235b-a22b-2507-v1:0}
  UPRAISE_LESSON_PLAN_LEVEL: ${UPRAISE_LESSON_PLAN_LEVEL:-intermediate}
  UPRAISE_LESSON_ALIGNMENT_BATCH_UNITS: ${UPRAISE_LESSON_ALIGNMENT_BATCH_UNITS:-4}
  UPRAISE_LESSON_LEVEL_PROFILES: '${UPRAISE_LESSON_LEVEL_PROFILES:-{"beginner":"Use plain language, define unfamiliar terms, and explain prerequisites and reasoning step by step. Retain substantive formulas and facts.","intermediate":"Assume basic familiarity; balance intuition with technical detail and explain key reasoning steps and new notation.","advanced":"Assume a strong foundation; use precise terminology and formal notation, explaining source-supported derivations, assumptions and limitations."}}'
  UPRAISE_LESSON_VISUAL_MODEL_ID: ${UPRAISE_LESSON_VISUAL_MODEL_ID:-eu.amazon.nova-pro-v1:0}
  UPRAISE_LESSON_TTL_SECONDS: ${UPRAISE_LESSON_TTL_SECONDS:-86400}
  UPRAISE_LESSON_SOURCE_WAIT_SECONDS: ${UPRAISE_LESSON_SOURCE_WAIT_SECONDS:-86400}
  UPRAISE_LESSON_TIMEOUT_SECONDS: ${UPRAISE_LESSON_TIMEOUT_SECONDS:-43200}
  UPRAISE_LESSON_SECONDS_PER_SECTION: ${UPRAISE_LESSON_SECONDS_PER_SECTION:-1200}
  UPRAISE_LESSON_SECONDS_PER_CHUNK: ${UPRAISE_LESSON_SECONDS_PER_CHUNK:-180}
  UPRAISE_LESSON_MAX_SOURCE_CHARACTERS: ${UPRAISE_LESSON_MAX_SOURCE_CHARACTERS:-120000}
  UPRAISE_LESSON_CAPTURE_MODEL_OUTPUTS: ${UPRAISE_LESSON_CAPTURE_MODEL_OUTPUTS:-false}
  UPRAISE_POLLY_ENGINE: ${UPRAISE_POLLY_ENGINE:-neural}
  UPRAISE_OPERATIONS_REFRESH_SECONDS: ${UPRAISE_OPERATIONS_REFRESH_SECONDS:-10}
  UPRAISE_OPERATIONS_PROBE_TIMEOUT_SECONDS: ${UPRAISE_OPERATIONS_PROBE_TIMEOUT_SECONDS:-2}
  UPRAISE_OPERATIONS_PROVIDER_TTL_SECONDS: ${UPRAISE_OPERATIONS_PROVIDER_TTL_SECONDS:-900}
  UPRAISE_OPERATIONS_WORKER_TTL_SECONDS: ${UPRAISE_OPERATIONS_WORKER_TTL_SECONDS:-150}
  UPRAISE_OPERATIONS_KILL_SWITCH: ${UPRAISE_OPERATIONS_KILL_SWITCH:-false}
  UPRAISE_OPERATIONS_LOCAL_ADMIN: ${UPRAISE_OPERATIONS_LOCAL_ADMIN:-false}
  UPRAISE_OPERATIONS_KILL_SWITCH_COURSES: ${UPRAISE_OPERATIONS_KILL_SWITCH_COURSES:-[]}
  UPRAISE_OPERATIONS_DISABLED_FEATURES: ${UPRAISE_OPERATIONS_DISABLED_FEATURES:-[]}
  UPRAISE_OPERATIONS_COURSE_DISABLED_FEATURES: ${UPRAISE_OPERATIONS_COURSE_DISABLED_FEATURES:-{}}
  UPRAISE_LESSON_PUBLIC_BASE_URL: ${UPRAISE_LESSON_PUBLIC_BASE_URL:-}
  UPRAISE_CALLBACK_ALLOWED_HOSTS: ${UPRAISE_CALLBACK_ALLOWED_HOSTS:-[]}
  UPRAISE_CALLBACK_ALLOWED_CIDRS: ${UPRAISE_CALLBACK_ALLOWED_CIDRS:-[]}
  UPRAISE_CALLBACK_TOKEN_URL: ${UPRAISE_CALLBACK_TOKEN_URL:-}
  UPRAISE_CALLBACK_CLIENT_ID: ${UPRAISE_CALLBACK_CLIENT_ID:-}
  UPRAISE_CALLBACK_CLIENT_SECRET: ${UPRAISE_CALLBACK_CLIENT_SECRET:-}
  UPRAISE_CALLBACK_OAUTH_AUTH_METHOD: ${UPRAISE_CALLBACK_OAUTH_AUTH_METHOD:-client_secret_basic}
  UPRAISE_CALLBACK_SCOPE: ${UPRAISE_CALLBACK_SCOPE:-lessons:deliver}
  UPRAISE_CALLBACK_CERTIFICATE: ${UPRAISE_CALLBACK_CERTIFICATE:-}
  UPRAISE_CALLBACK_PRIVATE_KEY: ${UPRAISE_CALLBACK_PRIVATE_KEY:-}
  UPRAISE_CALLBACK_CA_FILE: ${UPRAISE_CALLBACK_CA_FILE:-}
  UPRAISE_CALLBACK_MAX_ATTEMPTS: ${UPRAISE_CALLBACK_MAX_ATTEMPTS:-8}

services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *ingestion-environment
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-info}
      UPRAISE_SESSION_JWT_ISSUER: ${UPRAISE_SESSION_JWT_ISSUER:-}
      UPRAISE_SESSION_JWT_AUDIENCE: ${UPRAISE_SESSION_JWT_AUDIENCE:-upraise-learner-session}
      UPRAISE_SESSION_JWT_JWKS_URL: ${UPRAISE_SESSION_JWT_JWKS_URL:-}
      UPRAISE_SESSION_TTL_SECONDS: ${UPRAISE_SESSION_TTL_SECONDS:-1800}
      UPRAISE_SESSION_MAX_COUNT: ${UPRAISE_SESSION_MAX_COUNT:-10000}
      UPRAISE_SESSION_SWEEP_SECONDS: ${UPRAISE_SESSION_SWEEP_SECONDS:-30}
      UPRAISE_INTERRUPT_MAX_CONCURRENT: ${UPRAISE_INTERRUPT_MAX_CONCURRENT:-4}
      UPRAISE_INTERRUPT_MAX_AUDIO_BYTES: ${UPRAISE_INTERRUPT_MAX_AUDIO_BYTES:-6000000}
      UPRAISE_INTERRUPT_MAX_AUDIO_SECONDS: ${UPRAISE_INTERRUPT_MAX_AUDIO_SECONDS:-60}
      UPRAISE_INTERRUPT_SOURCE_CHARACTERS: ${UPRAISE_INTERRUPT_SOURCE_CHARACTERS:-24000}
      UPRAISE_INTERRUPT_PROVIDER_TIMEOUT_SECONDS: ${UPRAISE_INTERRUPT_PROVIDER_TIMEOUT_SECONDS:-45}
    volumes:
      - ingestion_data:/data/ingestion
      - type: bind
        source: ./aws_credentials.json
        target: /run/secrets/aws_credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert response.status == 200"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: upraise-backend
    build:
      context: ./backend
    command: ["python", "-m", "upraise_ai.storage.migrate"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-upraise_dev}
      PGPASSWORD: ${POSTGRES_PASSWORD:-upraise_dev_password}
      JOBS_DB: upraise_jobs
      JOBS_USER: upraise_jobs
      JOBS_PASSWORD: ${JOBS_PASSWORD:-upraise_jobs_password}
      AUDIT_DB: ${POSTGRES_DB:-upraise_audit}
      AUDIT_USER: upraise_audit_app
      AUDIT_PASSWORD: ${AUDIT_PASSWORD:-upraise_audit_password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    image: upraise-backend
    build:
      context: ./backend
    command: ["python", "-m", "upraise_ai.workers.ingestion"]
    environment:
      <<: *ingestion-environment
      UPRAISE_JOB_TIMEOUT_SECONDS: ${UPRAISE_JOB_TIMEOUT_SECONDS:-43200}
      UPRAISE_PARSE_TIMEOUT_BASE_SECONDS: ${UPRAISE_PARSE_TIMEOUT_BASE_SECONDS:-180}
      UPRAISE_PARSE_TIMEOUT_PER_PAGE_SECONDS: ${UPRAISE_PARSE_TIMEOUT_PER_PAGE_SECONDS:-10}
      UPRAISE_PARSE_TIMEOUT_PER_OCR_PAGE_SECONDS: ${UPRAISE_PARSE_TIMEOUT_PER_OCR_PAGE_SECONDS:-30}
      UPRAISE_ENRICH_TIMEOUT_BASE_SECONDS: ${UPRAISE_ENRICH_TIMEOUT_BASE_SECONDS:-180}
      UPRAISE_ENRICH_TIMEOUT_PER_REGION_SECONDS: ${UPRAISE_ENRICH_TIMEOUT_PER_REGION_SECONDS:-180}
      UPRAISE_EMBED_TIMEOUT_BASE_SECONDS: ${UPRAISE_EMBED_TIMEOUT_BASE_SECONDS:-120}
      UPRAISE_EMBED_TIMEOUT_PER_CHUNK_SECONDS: ${UPRAISE_EMBED_TIMEOUT_PER_CHUNK_SECONDS:-90}
      UPRAISE_WORKER_STARTUP_TIMEOUT_SECONDS: ${UPRAISE_WORKER_STARTUP_TIMEOUT_SECONDS:-300}
      UPRAISE_WORKER_PHASE_TIMEOUT_SECONDS: ${UPRAISE_WORKER_PHASE_TIMEOUT_SECONDS:-300}
      UPRAISE_WORKER_SUPERVISOR_POLL_SECONDS: ${UPRAISE_WORKER_SUPERVISOR_POLL_SECONDS:-1}
      UPRAISE_WORKER_STATUS_TIMEOUT_SECONDS: ${UPRAISE_WORKER_STATUS_TIMEOUT_SECONDS:-2}
      UPRAISE_WORKER_TERMINATE_GRACE_SECONDS: ${UPRAISE_WORKER_TERMINATE_GRACE_SECONDS:-5}
    volumes:
      - ingestion_data:/data/ingestion
      - model_cache:/cache
      - type: bind
        source: ./aws_credentials.json
        target: /run/secrets/aws_credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, time; p=pathlib.Path('/tmp/upraise-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lesson-worker: &lesson-worker
    image: upraise-backend
    build:
      context: ./backend
    command: ["python", "-m", "upraise_ai.workers.lessons"]
    environment:
      <<: *ingestion-environment
    volumes:
      - ingestion_data:/data/ingestion
      - type: bind
        source: ./aws_credentials.json
        target: /run/secrets/aws_credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./callback_tls
        target: /run/secrets/callback_tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, time; p=pathlib.Path('/tmp/upraise-lesson-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lesson-delivery:
    <<: *lesson-worker
    command: ["python", "-m", "upraise_ai.workers.lesson_delivery"]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, time; p=pathlib.Path('/tmp/upraise-delivery-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 150"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    profiles: ["tools"]
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      UPRAISE_LOCAL_TEST_MODE: ${UPRAISE_LOCAL_TEST_MODE:-false}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); assert response.status == 200"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend2:
    profiles: ["tools"]
    build:
      context: ./frontend2
    ports:
      - "127.0.0.1:${FRONTEND2_PORT:-8502}:8502"
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      FRONTEND2_PUBLIC_PORT: ${FRONTEND2_PORT:-8502}
      FRONTEND2_ACTIVITY_ID: ${FRONTEND2_ACTIVITY_ID:-upraise-learning}
      FRONTEND2_BACKEND_TOKEN: ${FRONTEND2_BACKEND_TOKEN:-}
      FRONTEND2_CLIENT_CERT: ${FRONTEND2_CLIENT_CERT:-}
      FRONTEND2_CLIENT_KEY: ${FRONTEND2_CLIENT_KEY:-}
      FRONTEND2_KEY_PASSWORD: ${FRONTEND2_KEY_PASSWORD:-}
      FRONTEND2_CA_CERT: ${FRONTEND2_CA_CERT:-}
      UPRAISE_LESSON_LEVEL_PROFILES: ${UPRAISE_LESSON_LEVEL_PROFILES:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,os; p=os.environ.get('FRONTEND2_PUBLIC_PORT','8502'); r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8502/',headers={'Host':'127.0.0.1:'+p}),timeout=3); assert r.status == 200"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The official image has Bash, but does not promise curl or wget.
      # Send an HTTP request using Bash builtins and check the status line.
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upraise_audit}
      POSTGRES_USER: ${POSTGRES_USER:-upraise_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upraise_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  qdrant_data:
  postgres_data:
  ingestion_data:
  model_cache:
