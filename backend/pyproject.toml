[project]
name = "upraise-ai"
version = "0.1.0"
description = "UPRAISE AI Module"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.22,<1",
    "psycopg[binary]>=3.3,<4",
    "qdrant-client>=1.18,<2",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "boto3>=1.43,<2",
    "docling[easyocr]==2.115.0",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "Pillow>=11,<13",
    "pypdf>=6,<7",
    "pypdfium2==5.13.0",
]

[dependency-groups]
dev = ["pytest>=9,<10", "reportlab>=4,<5", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["upraise_ai"]

[tool.ruff.lint.per-file-ignores]
# Preserve the recorded original V3 imports; other lint checks still apply.
"**/services/v3/*.py" = ["I001"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false
